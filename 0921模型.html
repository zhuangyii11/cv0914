    <title>莊依文｜模型展示</title>
    <style>
        :root {
            --ink: #111111;
            --paper: #eeeeeb;
            --muted: #777772;
            --line: rgba(17, 17, 17, .18);
            --accent: #e34d32;
            --sans: Manrope, Arial, sans-serif;
            --mono: "DM Mono", Menlo, monospace;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
        .sketchfab-embed-wrapper { width: 100%; min-height: 78vh; padding: 32px 3.2vw 18px; }
        .sketchfab-embed-wrapper iframe { display: block; width: 100%; height: min(78vh, 820px); border: 1px solid var(--line); background: #e3e3df; }
        .model-caption { margin: 10px 0 0; color: var(--muted); font: 11px/1.6 var(--mono); }
        .model-caption a { color: inherit; }
        .model-caption a:hover { color: var(--accent); }
        .contact-section { display: grid; grid-template-columns: 1fr 2.1fr; gap: 3rem; padding: 7rem 3.2vw; border-top: 1px solid var(--line); }
        .contact-mark { color: rgba(17, 17, 17, .1); font: 600 clamp(5rem, 16vw, 14rem)/.75 var(--sans); letter-spacing: -.16em; }
        .eyebrow { color: var(--accent); font: 11px var(--mono); letter-spacing: .08em; }
        .contact-section h1 { max-width: 720px; margin: 20px 0 36px; font: 500 clamp(3rem, 7vw, 7rem)/.95 var(--sans); letter-spacing: -.11em; }
        .contact-section h1 em { color: var(--accent); font-style: normal; }
        .contact-button { display: inline-flex; align-items: center; gap: 12px; padding: 13px 18px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font: 11px var(--mono); text-decoration: none; }
        .contact-button:hover { border-color: var(--accent); background: var(--accent); }
        .site-footer { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 2rem; padding: 42px 3.2vw; border-top: 1px solid var(--line); }
        .footer-name { font-size: 20px; font-weight: 600; letter-spacing: -.08em; }
        .site-footer p, .footer-contact, .site-footer small { color: var(--muted); font: 11px/1.7 var(--mono); }
        .site-footer p { margin: 8px 0 0; }
        .footer-contact { display: flex; flex-direction: column; gap: 6px; }
        .footer-contact a { color: inherit; text-decoration: none; }
        .footer-contact a:hover { color: var(--accent); }
        .site-footer small { align-self: end; }

        @media (max-width: 700px) {
            .sketchfab-embed-wrapper { min-height: 62vh; padding: 18px 5vw 14px; }
            .sketchfab-embed-wrapper iframe { height: 62vh; }
            .contact-section { display: block; padding: 5rem 5vw; }
            .contact-mark { margin-bottom: 3rem; }
            .site-footer { grid-template-columns: 1fr 1fr; padding: 34px 5vw; }
            .site-footer small { grid-column: 1 / -1; margin-top: 14px; }
        }
    </style>
</head>
